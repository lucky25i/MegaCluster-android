name: Build MEGA Cluster APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:

      - name: Télécharger le dépôt
        uses: actions/checkout@v4

      - name: Installer Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Installer Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'

      - name: Décompresser le projet
        run: |
          rm -rf build-source
          mkdir build-source
          unzip -q MegaCluster-android-prototype.zip -d build-source

      - name: Chercher automatiquement le projet Android
        id: find_project
        run: |
          PROJECT_DIR=$(find build-source -name settings.gradle.kts -type f -print -quit | xargs dirname)
          echo "Projet trouvé dans : $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Afficher le projet trouvé
        run: |
          echo "=============================="
          echo "PROJET ANDROID TROUVÉ"
          echo "=============================="
          echo "${{ steps.find_project.outputs.PROJECT_DIR }}"
          echo "=============================="

      - name: Installer gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          echo "$HOME/go/bin" >> "$GITHUB_PATH"
          "$HOME/go/bin/gomobile" init

      - name: Télécharger rclone
        uses: actions/checkout@v4
        with:
          repository: rclone/rclone
          ref: v1.75.1
          path: rclone-src

      - name: Construire librclone
        working-directory: rclone-src
        run: |
          "$HOME/go/bin/gomobile" bind \
            -target=android/arm64 \
            -androidapi 21 \
            -javapkg=org.rclone \
            ./librclone/gomobile

          mkdir -p "../${{ steps.find_project.outputs.PROJECT_DIR }}/app/libs"
          cp ./*.aar "../${{ steps.find_project.outputs.PROJECT_DIR }}/app/libs/librclone.aar"

      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compiler MEGA Cluster
        working-directory: ${{ steps.find_project.outputs.PROJECT_DIR }}
        run: |
          gradle assembleDebug --stacktrace

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: MegaCluster-debug
          path: ${{ steps.find_project.outputs.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
