name: Build MegaCluster Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-android:
    name: Build MegaCluster APK (arm64)
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout MegaCluster repository
        uses: actions/checkout@v4

      - name: Extract MegaCluster source ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP="./rclone-manager-0.3.3-megacluster-backup-import.zip"

          if [ ! -f "$ZIP" ]; then
            echo "::error::ZIP introuvable : $ZIP"
            exit 1
          fi

          rm -rf project
          mkdir -p project

          unzip -q "$ZIP" -d project

          PROJECT_DIR="$(find project -type f -name package.json -print -quit | xargs -r dirname)"

          if [ -z "$PROJECT_DIR" ]; then
            echo "::error::Impossible de trouver package.json dans le ZIP."
            find project -maxdepth 5 -type f | sort | head -300
            exit 1
          fi

          echo "Projet Tauri trouvé : $PROJECT_DIR"

          cp -a "$PROJECT_DIR"/. .

          rm -rf project

          if [ ! -f "package.json" ]; then
            echo "::error::package.json absent après extraction."
            exit 1
          fi

          if [ ! -f "src-tauri/Cargo.toml" ]; then
            echo "::error::src-tauri/Cargo.toml absent."
            exit 1
          fi

          if [ ! -f "src-tauri/tauri.conf.json" ]; then
            echo "::error::src-tauri/tauri.conf.json absent."
            exit 1
          fi

          echo "=== Projet ==="
          node -e "const p=require('./package.json'); console.log('package:',p.name,'version:',p.version)"

          echo "=== Tauri ==="
          node -e "const p=require('./src-tauri/tauri.conf.json'); console.log('app:',p.productName,'version:',p.version)"

      - name: Checkout rclone source
        uses: actions/checkout@v4
        with:
          repository: rclone/rclone
          path: rclone

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Setup Rust stable + Android target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK and NDK
        shell: bash
        run: |
          set -euo pipefail

          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;26.1.10909125"

          echo "NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> "$GITHUB_ENV"

      - name: Install frontend dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm install

      - name: Initialize Tauri Android project
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -d "src-tauri/gen/android" ]; then
            echo "Initialisation du projet Android Tauri..."
            npm run tauri android init -- --ci
          else
            echo "src-tauri/gen/android existe déjà."
          fi

      - name: Build arm64 APK
        shell: bash
        env:
          NDK_HOME: ${{ env.NDK_HOME }}
          RCLONE_SRC_DIR: ${{ github.workspace }}/rclone
        run: |
          set -euo pipefail

          VERSION="$(node -p "require('./src-tauri/tauri.conf.json').version")"

          rm -rf dist_apks
          mkdir -p dist_apks

          rm -rf src-tauri/gen/android/app/build/outputs/apk/

          echo "=========================================="
          echo "Construction de MegaCluster v$VERSION"
          echo "Architecture : aarch64 / arm64-v8a"
          echo "=========================================="

          RUSTFLAGS="-C link-arg=-Wl,-z,max-page-size=16384" \
            npm run tauri android build -- \
              --apk \
              --target aarch64 \
              --features mobile \
              --ci \
              -- \
              --no-default-features

          APK_PATH="$(find \
            src-tauri/gen/android/app/build/outputs/apk/ \
            -type f \
            -name '*.apk' \
            -print \
            -quit)"

          if [ -z "$APK_PATH" ] || [ ! -f "$APK_PATH" ]; then
            echo "::error::Aucun APK généré."

            echo "Fichiers présents :"
            find src-tauri/gen/android/app/build/outputs \
              -type f \
              -print \
              | sort || true

            exit 1
          fi

          cp "$APK_PATH" \
            "dist_apks/MegaCluster-${VERSION}-arm64-v8a.apk"

          echo ""
          echo "=========================================="
          echo "APK GÉNÉRÉ"
          echo "=========================================="

          ls -lh dist_apks/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MegaCluster-Android-arm64
          path: dist_apks/*.apk
          if-no-files-found: error
