name: Build APK

on:
  workflow_dispatch:
  push:
    paths:
      - '*.zip'
      - '.github/workflows/build-from-zip.yml'

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:

      - name: Checkout project
        uses: actions/checkout@v4


      - name: Find project ZIP
        id: zip
        shell: bash
        run: |
          set -euo pipefail

          ZIP="$(find . -maxdepth 1 -type f -name '*.zip' -print -quit)"

          if [ -z "$ZIP" ]; then
            echo "Aucun ZIP de projet trouvé à la racine." >&2
            exit 1
          fi

          echo "ZIP trouvé : $ZIP"
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"


      - name: Extract project
        shell: bash
        run: |
          set -euo pipefail

          rm -rf project
          mkdir project

          unzip -q "${{ steps.zip.outputs.zip }}" -d project

          test -f project/settings.gradle.kts

          cp -a project/. .

          rm -rf project


      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'


      - name: Prepare Android SDK
        shell: bash
        run: |
          set -euo pipefail

          SDKMANAGER="/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="/usr/local/lib/android/sdk/cmdline-tools/16.0/bin/sdkmanager"
          fi

          if [ ! -x "$SDKMANAGER" ]; then
            echo "sdkmanager introuvable."
            find /usr/local/lib/android -name sdkmanager -type f 2>/dev/null || true
            exit 1
          fi

          echo "sdkmanager : $SDKMANAGER"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

          yes | "$SDKMANAGER" --licenses >/dev/null || true


      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.6'


      - name: Install Android NDK
        shell: bash
        run: |
          set -euo pipefail

          "$SDKMANAGER" "ndk;27.2.12479018"

          test -d "$ANDROID_HOME/ndk/27.2.12479018"

          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

          echo "NDK installé."


      - name: Build rclone gomobile AAR with HTTP streaming support
        shell: bash
        run: |
          set -euo pipefail

          rm -rf "$GITHUB_WORKSPACE/rclone-src"

          git clone \
            --depth 1 \
            --branch v1.75.1 \
            https://github.com/rclone/rclone.git \
            "$GITHUB_WORKSPACE/rclone-src"

          cd "$GITHUB_WORKSPACE/rclone-src"

          test -f librclone/librclone/librclone.go

          python3 - <<'PY'
          from pathlib import Path

          p = Path("librclone/librclone/librclone.go")
          s = p.read_text()

          imp = '    _ "github.com/rclone/rclone/cmd/serve/http"\n'

          if imp not in s:
              marker = "import (\n"

              if marker not in s:
                  raise SystemExit("Bloc import introuvable.")

              s = s.replace(marker, marker + imp, 1)
              p.write_text(s)

          print("Import HTTP rclone présent.")
          PY

          grep -F \
            'github.com/rclone/rclone/cmd/serve/http' \
            librclone/librclone/librclone.go

          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest

          export PATH="$(go env GOPATH)/bin:$PATH"

          # Évite que gomobile soit bloqué par une erreur réseau
          # temporaire de sum.golang.org.
          export GOPROXY="https://proxy.golang.org,direct"
          export GOSUMDB="off"

          echo "GOPROXY=$GOPROXY"
          echo "GOSUMDB=$GOSUMDB"

          # Téléchargement préalable des dépendances.
          # Plusieurs tentatives permettent de contourner une erreur
          # réseau temporaire du proxy Go.
          success=0

          for attempt in 1 2 3 4 5; do
            echo "Téléchargement des modules Go — tentative $attempt/5"

            if go mod download; then
              success=1
              break
            fi

            echo "Échec du téléchargement, nouvelle tentative..."
            sleep 5
          done

          if [ "$success" -ne 1 ]; then
            echo "Impossible de télécharger les dépendances Go après 5 tentatives."
            exit 1
          fi

          echo "Dépendances Go téléchargées."

          gomobile init

          mkdir -p "$GITHUB_WORKSPACE/app/libs"

          gomobile bind \
            -target=android/arm64 \
            -androidapi 21 \
            -javapkg=org.rclone \
            -o "$GITHUB_WORKSPACE/app/libs/librclone.aar" \
            -ldflags '-s -X github.com/rclone/rclone/fs.Version=1.75.1' \
            ./librclone/gomobile

          test -s "$GITHUB_WORKSPACE/app/libs/librclone.aar"

          ls -lh "$GITHUB_WORKSPACE/app/libs/librclone.aar"

          echo "librclone.aar créé."


      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'


      - name: Generate Gradle wrapper
        shell: bash
        run: |
          set -euo pipefail

          rm -rf gradle/wrapper

          gradle wrapper --gradle-version 8.9

          test -f gradlew
          test -f gradle/wrapper/gradle-wrapper.jar
          test -f gradle/wrapper/gradle-wrapper.properties

          echo "Gradle wrapper généré."


      - name: Make Gradle wrapper executable
        shell: bash
        run: |
          set -euo pipefail

          chmod +x ./gradlew

          test -x ./gradlew


      - name: Build APK
        shell: bash
        run: |
         
