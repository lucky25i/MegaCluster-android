name: Build MEGA Cluster APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'

      - name: Extraire le projet
        run: |
          rm -rf build-source
          mkdir build-source
          unzip -q MegaCluster-android-prototype.zip -d build-source

      - name: Vérifier le projet
        run: |
          find build-source -maxdepth 3 -type f | sort

      - name: Corriger les cibles Java/Kotlin
        working-directory: build-source/MegaCluster-android-prototype
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("app/build.gradle.kts")
          s = p.read_text()

          s = s.replace(
              'compileOptions {',
              'compileOptions {'
          )

          if 'kotlinOptions {' not in s:
              s += '''

          kotlin {
              jvmToolchain(21)
          }
          '''

          p.write_text(s)
          PY

          echo "----- build.gradle.kts -----"
          cat app/build.gradle.kts

      - name: Installer gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          echo "$HOME/go/bin" >> "$GITHUB_PATH"
          "$HOME/go/bin/gomobile" init

      - name: Télécharger rclone
        uses: actions/checkout@v4
        with:
          repository: rclone/rclone
          ref: v1.75.1
          path: rclone-src

      - name: Construire librclone
        working-directory: rclone-src
        run: |
          "$HOME/go/bin/gomobile" bind \
            -v \
            -target=android/arm64 \
            -androidapi 21 \
            -javapkg=org.rclone \
            ./librclone/gomobile

          mkdir -p ../build-source/MegaCluster-android-prototype/app/libs
          cp ./*.aar ../build-source/MegaCluster-android-prototype/app/libs/librclone.aar

      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compiler APK
        working-directory: build-source/MegaCluster-android-prototype
        run: |
          gradle assembleDebug --stacktrace

      - name: Publier APK
        uses: actions/upload-artifact@v4
        with:
          name: MegaCluster-debug
          path: build-source/MegaCluster-android-prototype/app/build/outputs/apk/debug/*.apk
