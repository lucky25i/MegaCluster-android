name: Build MEGA Cluster APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Télécharger le dépôt
        uses: actions/checkout@v4

      - name: Installer Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Installer Android SDK
        uses: android-actions/setup-android@v3

      - name: Installer les composants Android
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Extraire le projet
        run: |
          mkdir -p build-source
          unzip -q MegaCluster-android-prototype.zip -d build-source

      - name: Vérifier les fichiers
        run: |
          find build-source -maxdepth 3 -type f | sort

      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compiler l'application
        working-directory: build-source/MegaCluster
        run: |
          gradle assembleDebug --stacktrace

      - name: Récupérer l'APK
        uses: actions/upload-artifact@v4
        with:
          name: MegaCluster-debug
          path: build-source/MegaCluster/app/build/outputs/apk/debug/*.apk
