name: Build RClone Manager APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find project ZIP
        shell: bash
        run: |
          set -e

          ZIP="./rclone-manager-0.3.3-megacluster-backup-import.zip"

          if [ ! -f "$ZIP" ]; then
            echo "::error::ZIP introuvable : $ZIP"
            echo "Fichiers présents dans le dépôt :"
            find . -maxdepth 2 -type f | sort
            exit 1
          fi

          echo "ZIP trouvé : $ZIP"

      - name: Extract project
        shell: bash
        run: |
          set -e

          rm -rf project
          mkdir -p project

          unzip -q "./rclone-manager-0.3.3-megacluster-backup-import.zip" -d project

          echo "Recherche de settings.gradle.kts..."

          PROJECT_DIR="$(find project -type f -name 'settings.gradle.kts' -print -quit | xargs -r dirname)"

          if [ -z "$PROJECT_DIR" ]; then
            echo "::error::Impossible de trouver settings.gradle.kts dans le ZIP."
            echo "Contenu extrait :"
            find project -maxdepth 4 -type f | sort | head -300
            exit 1
          fi

          echo "Projet trouvé dans : $PROJECT_DIR"

          cp -a "$PROJECT_DIR"/. .

          rm -rf project

          echo "Racine du projet :"
          ls -la

          if [ ! -f "settings.gradle.kts" ]; then
            echo "::error::settings.gradle.kts absent après extraction."
            exit 1
          fi

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.6'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        shell: bash
        run: |
          set -e

          sdkmanager --install "ndk;27.2.12479018"

          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Clone rclone
        shell: bash
        run: |
          set -e

          rm -rf rclone

          git clone --depth 1 --branch v1.75.1 \
            https://github.com/rclone/rclone.git

      - name: Prepare rclone for librclone
        shell: bash
        run: |
          set -e

          cd rclone

          grep -q 'github.com/rclone/rclone/cmd/serve/http' \
            librclone/librclone/librclone.go || \
          sed -i '/^import (/a\\	_ "github.com/rclone/rclone/cmd/serve/http"' \
            librclone/librclone/librclone.go

          echo "Vérification de librclone.go :"
          sed -n '1,80p' librclone/librclone/librclone.go

      - name: Build librclone.aar
        shell: bash
        run: |
          set -e

          cd rclone

          export ANDROID_NDK_HOME="$ANDROID_SDK_ROOT/ndk/27.2.12479018"

          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest

          export PATH="$(go env GOPATH)/bin:$PATH"

          gomobile init

          cd librclone

          gomobile bind \
            -target=android \
            -androidapi=23 \
            -o librclone.aar \
            ./librclone

          echo "AAR généré :"
          ls -lh librclone.aar

      - name: Install librclone.aar
        shell: bash
        run: |
          set -e

          mkdir -p app/libs

          cp rclone/librclone/librclone.aar app/libs/librclone.aar

          echo "Contenu de app/libs :"
          ls -lh app/libs

      - name: Generate Gradle wrapper
        shell: bash
        run: |
          set -e

          if [ ! -f "./gradlew" ]; then
            echo "gradlew absent : génération du wrapper..."

            mkdir -p /tmp/gradle

            cd /tmp/gradle

            wget -q \
              https://services.gradle.org/distributions/gradle-8.9-bin.zip \
              -O gradle.zip

            unzip -q gradle.zip

            cd gradle-8.9

            ./bin/gradle wrapper \
              --gradle-version 8.9 \
              --distribution-type bin

            cp gradlew "$GITHUB_WORKSPACE/gradlew"
            cp -r gradle "$GITHUB_WORKSPACE/gradle"
          fi

          chmod +x ./gradlew

          echo "Gradle wrapper prêt."

      - name: Check Android project
        shell: bash
        run: |
          set -e

          echo "settings.gradle.kts :"
          ls -lh settings.gradle.kts

          echo
          echo "build.gradle files :"
          find . -maxdepth 3 \
            \( -name 'build.gradle' -o -name 'build.gradle.kts' \) \
            -print | sort

          echo
          echo "Android manifests :"
          find . -name AndroidManifest.xml -print | sort

          echo
          echo "librclone :"
          ls -lh app/libs/librclone.aar

      - name: Build debug APK
        shell: bash
        run: |
          set -e

          ./gradlew \
            --no-daemon \
            --stacktrace \
            assembleDebug

      - name: Find APK
        shell: bash
        run: |
          set -e

          echo "APK générés :"
          find . \
            -type f \
            \( -name "*.apk" -o -name "*.aab" \) \
            -print | sort

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RClone-Manager-debug-apk
          path: |
            **/build/outputs/apk/debug/*.apk
          if-no-files-found: error
