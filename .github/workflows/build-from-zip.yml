name: Build APK

on:
  workflow_dispatch:
  push:
    paths:
      - '*.zip'
      - '.github/workflows/build-from-zip.yml'

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:

      - name: Checkout project
        uses: actions/checkout@v4


      - name: Find project ZIP
        id: zip
        shell: bash
        run: |
          set -euo pipefail

          ZIP="$(find . -maxdepth 1 -type f -name '*.zip' -print -quit)"

          if [ -z "$ZIP" ]; then
            echo "Aucun ZIP de projet trouvé à la racine." >&2
            exit 1
          fi

          echo "ZIP trouvé : $ZIP"
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"


      - name: Extract project
        shell: bash
        run: |
          set -euo pipefail

          rm -rf project
          mkdir project

          unzip -q "${{ steps.zip.outputs.zip }}" -d project

          test -f project/settings.gradle.kts

          cp -a project/. .

          rm -rf project


      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'


