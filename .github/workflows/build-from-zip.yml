name: Build MEGA Cluster APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'

      - name: Extraire le projet
        run: |
          rm -rf build-source
          mkdir build-source
          unzip -q MegaCluster-android-prototype.zip -d build-source
          echo "Projet extrait :"
          find build-source -maxdepth 3 -type f | sort

      - name: Installer gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          echo "$HOME/go/bin" >> "$GITHUB_PATH"
          "$HOME/go/bin/gomobile" init

      - name: Télécharger rclone
        uses: actions/checkout@v4
        with:
          repository: rclone/rclone
          ref: v1.75.1
          path: rclone-src

      - name: Vérifier Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls -la "$ANDROID_HOME"
          ls -la "$ANDROID_HOME/ndk" || true
          ls -la "$ANDROID_HOME/platforms" || true
          ls -la "$ANDROID_HOME/build-tools" || true

      - name: Construire librclone AAR
        working-directory: rclone-src
        run: |
          VERSION=$(git describe --tags --always)

          "$HOME/go/bin/gomobile" bind \
            -v \
            -target=android/arm64 \
            -androidapi 21 \
            -javapkg=org.rclone \
            -ldflags "-s -X github.com/rclone/rclone/fs.Version=${VERSION}" \
            ./librclone/gomobile

          mkdir -p ../build-source/MegaCluster/app/libs
          cp ./*.aar ../build-source/MegaCluster/app/libs/librclone.aar

          echo "AAR créé :"
          ls -lh ../build-source/MegaCluster/app/libs/

      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compiler APK
        working-directory: build-source/MegaCluster
        run: |
          gradle assembleDebug --stacktrace

      - name: Publier APK
        uses: actions/upload-artifact@v4
        with:
          name: MegaCluster-debug
          path: build-source/MegaCluster/app/build/outputs/apk/debug/*.apk
