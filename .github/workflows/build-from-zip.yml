name: Build APK

on:
  workflow_dispatch:
  push:
    paths:
      - '*.zip'
      - '.github/workflows/build-from-zip.yml'

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Find project ZIP
        id: zip
        shell: bash
        run: |
          set -euo pipefail
          ZIP="$(find . -maxdepth 1 -type f -name '*.zip' -print -quit)"
          if [ -z "$ZIP" ]; then
            echo 'Aucun ZIP de projet trouvé à la racine.' >&2
            exit 1
          fi
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"

      - name: Extract project
        shell: bash
        run: |
          set -euo pipefail
          rm -rf project
          mkdir project
          unzip -q "${{ steps.zip.outputs.zip }}" -d project
          test -f project/settings.gradle.kts
          cp -a project/. .
          rm -rf project

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.6'

      - name: Set up Android NDK
        uses: android-actions/setup-ndk@v3
        with:
          ndk-version: '27.2.12479018'

      - name: Build rclone gomobile AAR with HTTP serve support
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE/rclone-src"
          git clone --depth 1 --branch v1.75.1 https://github.com/rclone/rclone.git "$GITHUB_WORKSPACE/rclone-src"
          cd "$GITHUB_WORKSPACE/rclone-src"

          # librclone exposes the RC API, but the serve/* RC handlers live in
          # cmd/serve. Importing the package registers serve/start, serve/list
          # and serve/stop in the in-process RC registry.
          python3 - <<'PY'
          from pathlib import Path
          p = Path('librclone/librclone/librclone.go')
          s = p.read_text()
          imp = '    _ "github.com/rclone/rclone/cmd/serve"\n'
          if imp not in s:
              needle = '    "github.com/rclone/rclone/fs/rc/jobs"\n'
              if needle not in s:
                  raise SystemExit('Import point not found in librclone.go')
              s = s.replace(needle, needle + imp, 1)
              p.write_text(s)
          PY

          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          export PATH="$(go env GOPATH)/bin:$PATH"
          gomobile init
          gomobile bind -target=android/arm64 -androidapi 21 -javapkg=org.rclone -ldflags '-s -X github.com/rclone/rclone/fs.Version=1.75.1' ./librclone/gomobile
          mkdir -p "$GITHUB_WORKSPACE/app/libs"
          cp -f ./librclone/gomobile/gomobile.aar "$GITHUB_WORKSPACE/app/libs/librclone.aar"
          test -s "$GITHUB_WORKSPACE/app/libs/librclone.aar"

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MegaCluster-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          
