name: Build APK from ZIP

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract the project ZIP
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build-source

          mapfile -t ZIPS < <(find . -maxdepth 1 -type f -name '*.zip' -print)
          if [ "${#ZIPS[@]}" -ne 1 ]; then
            echo "Expected exactly one project ZIP in the repository root."
            printf 'Found: %s\n' "${ZIPS[@]:-none}"
            exit 1
          fi

          ZIP_FILE="${ZIPS[0]}"
          echo "Using project ZIP: $ZIP_FILE"
          unzip -q "$ZIP_FILE" -d build-source

          PROJECT_DIR="$(find build-source -type f -name settings.gradle.kts -print -quit | xargs -r dirname)"
          if [ -z "$PROJECT_DIR" ] || [ ! -f "$PROJECT_DIR/settings.gradle.kts" ]; then
            echo "Could not find settings.gradle.kts in the extracted project."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project detected at: $PROJECT_DIR"

      - name: Checkout rclone v1.75.1
        uses: actions/checkout@v4
        with:
          repository: rclone/rclone
          ref: v1.75.1
          path: rclone-src

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'

      - name: Install Android SDK components
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          set -euo pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.2.12479018"

      - name: Install gomobile
        run: |
          set -euo pipefail
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          echo "$HOME/go/bin" >> "$GITHUB_PATH"
          "$HOME/go/bin/gomobile" init

      - name: Build rclone Android AAR
        working-directory: rclone-src
        env:
          ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/27.2.12479018
        run: |
          set -euo pipefail
          VERSION="$(git describe --tags --always)"
          "$HOME/go/bin/gomobile" bind -v \
            -target=android/arm64 \
            -androidapi 21 \
            -javapkg=org.rclone \
            -ldflags "-s -X github.com/rclone/rclone/fs.Version=${VERSION}" \
            ./librclone/gomobile

          mkdir -p "$PROJECT_DIR/app/libs"
          cp ./*.aar "$PROJECT_DIR/app/libs/librclone.aar"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MegaCluster-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
